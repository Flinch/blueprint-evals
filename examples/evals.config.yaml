# Example config. Start the stub agent first:  npm run stub-agent
#
# The simulator runs on Haiku 5.5 (cheap, fine for plain personas). The judge
# runs on Sonnet 5.5, because a judge that passes a bad agent is the costly
# mistake. A full run of the example scenarios costs a few cents.
# examples/evals.judge-haiku.config.yaml is the same setup with a Haiku judge,
# for comparing the two with `evals calibrate`.
# Haiku has no server-side refusal fallback, so its fallbacks setting is off.
models:
  simulator: { provider: anthropic, model: claude-haiku-5-5, effort: low, fallbacks: false }
  judge:     { provider: anthropic, model: claude-sonnet-5-5, effort: high, fallbacks: true }
pricing:
  claude-haiku-5-5:  { inputPerMTok: 0.10, outputPerMTok: 0.50 }
  claude-sonnet-5-5: { inputPerMTok: 2.00, outputPerMTok: 10.00 }
targets:
  stub-agent:
    kind: http
    url: http://127.0.0.1:4010/chat
    request:
      body:
        message: "{{input.text}}"
        conversation_id: "{{session}}"
    response:
      text: "$.reply"
      session: "$.conversation_id"
      toolCalls:
        path: "$.tool_calls[*]"
        name: "$.name"
        arguments: "$.args"
    toolCalls: reported
